  <script>
  // GMod-CEF-Fix: Das Mausrad scrollt dort nur das Dokument, nicht innere
  // overflow-Container. Dieser Handler scrollt den .dp-scroll-Bereich unter
  // dem Cursor manuell — gilt für ALLE Listen (Fahndung, Akten, Aufgaben …).
  (function () {
    document.addEventListener('wheel', function (e) {
      var el = document.elementFromPoint(e.clientX, e.clientY) || e.target;
      while (el && el !== document.documentElement) {
        if (el.classList && el.classList.contains('dp-scroll') && el.scrollHeight > el.clientHeight + 1) {
          el.scrollTop += (e.deltaY || 0);
          e.preventDefault();
          return;
        }
        el = el.parentElement;
      }
    }, { passive: false });
  })();
  </script>
