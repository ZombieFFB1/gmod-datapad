    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();

              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

93, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   CLOSE BUTTON — persistent, top-right of the screen.\n   Always reachable (boot, lock, desktop). In GMod it calls\n   window.datapad.close(); in the browser prototype it just\n   re-locks / does nothing harmful.\n   ============================================================ */\n.dp-close {\n  position: absolute;\n  top: 9px;\n  right: 11px;\n  z-index: 120;\n  width: 30px;\n  height: 30px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  border-radius: 50%;\n  border: 1px solid var(--line, rgba(51,201,255,0.20));\n  background: color-mix(in oklab, var(--bg-0, #04141f) 50%, transparent);\n  color: var(--text-2, #5f8295);\n  cursor: pointer;\n  transition: .15s;\n  -webkit-backdrop-filter: blur(4px);\n  backdrop-filter: blur(4px);\n}\n.dp-close svg { width: 15px; height: 15px; display: block; }\n.dp-close:hover {\n  border-color: var(--danger, #ff5a5a);\n  background: var(--danger, #ff5a5a);\n  color: #fff;\n  box-shadow: 0 0 18px color-mix(in oklab, var(--danger, #ff5a5a) 55%, transparent);\n}\n.dp-close:active { transform: scale(.9); }\n\n/* ============================================================\n   END OF WAR — STAR WARS DATAPAD\n   Theme-driven stylesheet. All colors come from CSS variables\n   set on .dp-screen by the theme system (see core.jsx).\n   ============================================================ */\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\n:root {\n  --font-display: 'Orbitron', sans-serif;\n  --font-ui: 'Chakra Petch', sans-serif;\n  --font-mono: 'Share Tech Mono', monospace;\n}\n\nhtml, body {\n  height: 100%;\n  background: transparent;\n  overflow: hidden;\n  font-family: var(--font-ui);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ---- Stage: letterbox the fixed device on black ----\n   NOTE: GMod's embedded browser (DHTML) does not reliably honour\n   `grid place-items:center`. We center the device with absolute\n   positioning + translate, which works in every engine. The scale\n   is appended by JS in app.jsx (fit()).                                */\n/* Stage is fully transparent: in GMod only the datapad device shows over\n   the game world (no black letterbox box around it). The browser prototype\n   simply floats the device on the page background. */\n#stage {\n  position: fixed;\n  top: 0; right: 0; bottom: 0; left: 0;\n  width: 100%;\n  height: 100%;\n  overflow: hidden;\n  background: transparent;\n}\n#device-scale {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  transform: translate(-50%, -50%) scale(1);\n  transform-origin: center center;\n}\n\n/* ---- Device bezel (landscape tablet 16:10) ---- */\n.dp-device {\n  width: 1280px;\n  height: 800px;\n  position: relative;\n  padding: 26px 64px;\n  border-radius: 38px;\n  background:\n    linear-gradient(145deg, #2b3038, #14171b 55%, #0a0c0e);\n  box-shadow:\n    0 0 0 2px rgba(255,255,255,0.04),\n    inset 0 2px 3px rgba(255,255,255,0.10),\n    inset 0 -3px 6px rgba(0,0,0,0.7),\n    0 40px 90px rgba(0,0,0,0.7);\n}\n.dp-device::before { /* speaker grille / camera */\n  content: '';\n  position: absolute;\n  left: 28px; top: 50%;\n  width: 10px; height: 10px; margin-top: -5px;\n  border-radius: 50%;\n  background: radial-gradient(circle at 35% 35%, #3a4654, #0c0f12);\n  box-shadow: 0 0 0 3px rgba(0,0,0,0.5), inset 0 0 3px rgba(120,200,255,0.4);\n}\n.dp-device::after { /* right side button */\n  content: '';\n  position: absolute;\n  right: 26px; top: 50%;\n  width: 12px; height: 8px; margin-top: -4px;\n  border-radius: 2px;\n  background: linear-gradient(#3a4048,#1a1d22);\n}\n.dp-grip {\n  position: absolute;\n  right: 22px; top: 50%;\n  width: 6px; height: 120px; margin-top: -60px;\n  border-radius: 4px;\n  background: repeating-linear-gradient(#23282f 0 4px, #14171b 4px 8px);\n}\n\n/* ---- Screen ---- */\n.dp-screen {\n  position: relative;\n  width: 1152px;\n  height: 748px;\n  border-radius: 14px;\n  overflow: hidden;\n  background:\n    radial-gradient(140% 120% at 50% -10%, var(--bg-glow) 0%, transparent 55%),\n    var(--bg-0);\n  color: var(--text-0);\n  font-family: var(--font-ui);\n  user-select: none;\n  isolation: isolate;\n}\n/* scanlines + vignette overlay */\n.dp-screen::after {\n  content: '';\n  position: absolute; top: 0; right: 0; bottom: 0; left: 0;\n  pointer-events: none;\n  background:\n    repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0 1px, transparent 1px 3px),\n    radial-gradient(120% 120% at 50% 50%, transparent 60%, rgba(0,0,0,0.45) 100%);\n  mix-blend-mode: multiply;\n  opacity: var(--scanline, 0.5);\n  z-index: 60;\n}\n\n/* ============================================================\n   STATUS BAR\n   ============================================================ */\n.dp-statusbar {\n  height: 40px;\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  padding: 0 50px 0 20px; /* extra right padding clears the round close button */\n  font-family: var(--font-mono);\n  font-size: 13px;\n  letter-spacing: 0.08em;\n  color: var(--text-1);\n  border-bottom: 1px solid var(--line);\n  background: linear-gradient(var(--panel-1), transparent);\n  position: relative; z-index: 30;\n}\n.dp-statusbar .sb-brand {\n  font-family: var(--font-display);\n  font-weight: 700;\n  letter-spacing: 0.22em;\n  color: var(--accent);\n  text-shadow: 0 0 10px var(--accent-glow);\n  font-size: 12px;\n}\n.dp-statusbar .sb-spacer { flex: 1; }\n.dp-statusbar .sb-item { display: flex; align-items: center; gap: 6px; }\n.dp-bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }\n.dp-bars i { width: 3px; background: var(--accent); display: block; opacity: 0.9; }\n.dp-bars i:nth-child(1){height:4px}.dp-bars i:nth-child(2){height:7px}\n.dp-bars i:nth-child(3){height:10px}.dp-bars i:nth-child(4){height:12px}\n\n/* ============================================================\n   GENERIC PANELS / DECOR\n   ============================================================ */\n.dp-panel {\n  position: relative;\n  background: var(--panel-0);\n  border: 1px solid var(--line);\n  border-radius: 8px;\n}\n.dp-bracket::before, .dp-bracket::after {\n  content: '';\n  position: absolute; width: 14px; height: 14px;\n  border: 2px solid var(--accent);\n  opacity: 0.8;\n}\n.dp-bracket::before { left: -1px; top: -1px; border-right: none; border-bottom: none; }\n.dp-bracket::after  { right: -1px; bottom: -1px; border-left: none; border-top: none; }\n\n.dp-label {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--text-2);\n}\n.dp-h {\n  font-family: var(--font-display);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--text-0);\n}\n\n/* App view shell */\n.dp-view { position: absolute; top: 40px; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; z-index: 20; }\n.dp-appbar {\n  height: 58px; flex: 0 0 auto;\n  display: flex; align-items: center; gap: 14px;\n  padding: 0 22px;\n  border-bottom: 1px solid var(--line);\n  background: linear-gradient(var(--panel-1), transparent);\n}\n.dp-appbar .title {\n  font-family: var(--font-display);\n  font-size: 17px; font-weight: 700;\n  letter-spacing: 0.16em; text-transform: uppercase;\n  color: var(--text-0);\n}\n.dp-appbar .sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); letter-spacing: 0.12em; }\n.dp-appbody { flex: 1; min-height: 0; position: relative; }\n\n/* Back / icon button */\n.dp-iconbtn {\n  width: 38px; height: 38px;\n  display: grid; place-items: center;\n  border-radius: 7px;\n  border: 1px solid var(--line);\n  background: var(--panel-0);\n  color: var(--accent);\n  cursor: pointer;\n  font-size: 18px;\n  transition: .14s;\n}\n.dp-iconbtn:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); color: var(--text-0); }\n\n/* Buttons */\n.dp-btn {\n  font-family: var(--font-ui);\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  font-size: 14px;\n  padding: 10px 18px;\n  border-radius: 7px;\n  border: 1px solid var(--accent-dim);\n  background: var(--accent-fill);\n  color: var(--accent);\n  cursor: pointer;\n  transition: .14s;\n  text-transform: uppercase;\n}\n.dp-btn:hover { background: var(--accent); color: var(--bg-0); box-shadow: 0 0 16px var(--accent-glow); }\n.dp-btn.ghost { background: transparent; color: var(--text-1); border-color: var(--line); }\n.dp-btn.ghost:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }\n.dp-btn.danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 50%, transparent); background: color-mix(in oklab, var(--danger) 12%, transparent); }\n.dp-btn.danger:hover { background: var(--danger); color: #fff; box-shadow: 0 0 16px color-mix(in oklab, var(--danger) 60%, transparent); }\n.dp-btn:disabled { opacity: .4; cursor: not-allowed; }\n\ninput.dp-input, textarea.dp-input {\n  font-family: var(--font-ui);\n  font-size: 14px;\n  color: var(--text-0);\n  background: var(--panel-0);\n  border: 1px solid var(--line);\n  border-radius: 7px;\n  padding: 10px 12px;\n  outline: none;\n  width: 100%;\n  transition: .14s;\n}\ninput.dp-input:focus, textarea.dp-input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow); }\n.dp-input::placeholder { color: var(--text-2); }\n\n/* scrollbars */\n.dp-scroll { overflow-y: auto; overflow-x: hidden; }\n.dp-scroll::-webkit-scrollbar { width: 8px; }\n.dp-scroll::-webkit-scrollbar-track { background: transparent; }\n.dp-scroll::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 8px; }\n.dp-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); }\n\n/* ============================================================\n   BOOT SCREEN\n   ============================================================ */\n.dp-boot {\n  position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: ck .dp-lock-inner {\n  position: absolute;\n  left: 50%; top: 50%;\n  transform: translate(-50%, -50%);\n  width: 360px;\n  text-align: center;\n}\n.dp-lock .dp-lock-inner > * { margin-left: auto; margin-right: auto; }\n.dp-lock .clock { font-family: var(--font-display); font-size: 74px; font-weight: 700; letter-spacing: 0.06em; color: var(--text-0); text-shadow: 0 0 30px var(--accent-glow); }\n.dp-lock .date  { font-family: var(--font-mono); letter-spacing: 0.22em; color: var(--text-2); text-transform: uppercase; font-size: 13px; margin-top: 10px; }\n.dp-lock .dp-label { margin-top: 22px; }\n.dp-pin { display: flex; gap: 14px; margin-top: 20px; width: max-content; }\n.dp-pin .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent-dim); transition: .14s; }\n.dp-pin .dot.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }\n.dp-pin.err { animation: dp-shake .4s; }\n@keyframes dp-shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }\n.dp-keys { display: grid; grid-template-columns: repeat(3, 78px); gap: 14px; margin-top: 26px; transform: translateX(50px); }\n.dp-keys button {\n  height: 70px; border-radius: 12px;\n  border: 1px solid var(--line);\n  background: var(--panel-0);\n  color: var(--text-0);\n  font-family: var(--font-display); font-size: 24px; font-weight: 600;\n  cursor: pointer; transition: .12s;\n}\n.dp-keys button:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 14px var(--accent-glow); }\n.dp-keys button:active { transform: scale(.94); }\n.dp-keys .sub { font-family: var(--font-mono); font-size: 9px; letter-spacing: .2em; color: var(--text-2); display:block; margin-top:-4px; }\n.dp-keys .util { font-size: 13px; font-family: var(--font-ui); letter-spacing: .1em; }\n.dp-lock-hint { font-family: var(--font-mono); font-size: 11px; color: v
